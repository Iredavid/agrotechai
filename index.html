      rel="stylesheet"
    />

    <!-- Preload the LCP element (Hero.tsx's hero-photo). This is a
         client-rendered SPA, so without this the browser has no idea
         this image exists until the JS bundle downloads AND executes
         AND React mounts -- this lets it start the fetch straight from
         the raw HTML, in parallel with everything else. srcset/sizes
         here must match the <img>'s srcset/sizes exactly, or the
         browser preloads a different variant than the one actually
         used and you pay for two downloads instead of one. -->
    <link
      rel="preload"
      as="image"
      imagesrcset="
        https://res.cloudinary.com/ffkfh5xr/image/upload/f_auto,q_auto,c_limit,w_400/v1786130689/agricHero_rzf5cm.avif 400w,
        https://res.cloudinary.com/ffkfh5xr/image/upload/f_auto,q_auto,c_limit,w_600/v1786130689/agricHero_rzf5cm.avif 600w,
        https://res.cloudinary.com/ffkfh5xr/image/upload/f_auto,q_auto,c_limit,w_768/v1786130689/agricHero_rzf5cm.avif 768w
      "
      imagesizes="(max-width: 600px) 90vw, 500px"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
